spring:
  application:
    name: user-auth
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  sql:
    init:
      mode: always
      schema-locations:
        - file:./config/db/schema.sql
  datasource:
    url: jdbc:mysql://localhost:3306/user_auth?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    open-in-view: false

framework:
  persistence:
    naming:
      table-prefix: ua_

cosid:
  namespace: user-auth
  segment:
    enabled: true
    distributor:
      type: jdbc
      jdbc:
        enable-auto-init-cosid-table: true
    provider:
      user: { offset: 0, step: 100 }
      auth_account: { offset: 0, step: 100 }
      credential: { offset: 0, step: 100 }
      auth_challenge: { offset: 0, step: 100 }
      registration_process: { offset: 0, step: 100 }
      domain_event: { offset: 0, step: 100 }

server:
  port: 8081

user-auth:
  authentication:
    client-apps:
      mini-program:
        renewal-policy: EXTERNAL_AUTHORIZATION_CODE
        oauth2-scopes:
          - app
      app:
        renewal-policy: REFRESH_TOKEN_ROTATION
        oauth2-scopes:
          - app
      admin:
        renewal-policy: NONE
        oauth2-scopes:
          - admin
    oauth2:
      authorization-server:
        sas:
          internal-token-client:
            client-id: user-auth-client
            client-secret: local-development-secret
          introspection-client:
            client-id: gateway-introspection-client
            client-secret: local-gateway-introspection-secret
          scopes:
            - app
            - admin
          audiences:
            - cloud-api
    challenge:
      pepper: local-development-pepper
      non-production:
        fixed-code: "123456"
    external-identity:
      issuer-policies:
        WECHAT_MINI_PROGRAM:
          trust-verified-mobile: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  bulkhead:
    instances:
      sasInternalTokenEndpoint:
        max-concurrent-calls: 32
